<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secure 3D-Printer Fleet</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Secure 3D-Printer Fleet</div>
      <div class="session">
        <span id="whoami" class="muted"></span>
        <span id="status-pill" class="pill">checking...</span>
        <button id="logout" class="btn ghost hidden">Sign out</button>
      </div>
    </header>
    <nav id="nav" class="nav hidden"></nav>
    <main id="view" class="container"></main>
    <footer class="foot muted">
      Tier A0: tamper-evident. Verification claims are labeled with the tier that
      earns them. This build uses simulated printers and sensors.
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
